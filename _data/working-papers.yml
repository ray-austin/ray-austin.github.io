- title: "When Goals Align: Examiner–Applicant Interaction and the Speed–Quality Trade-off in Fast-Track Patent Applications"
  authors: "Rui Liu, Xuezhong Zhu, Meiyang Zhang & Qimeng Jiang"
  year: 2026
  venue: "SSRN Working Paper"
  status: "Working paper"
  role: "First author"
  excerpt: "Using China’s 2012 Fast-track Patent Applications policy as a quasi-natural experiment, this study examines how accelerated examination affects patent-grant decisions and claim scope. It identifies an “acceleration alignment”: examiners cite less prior art while applicants narrow claims more aggressively to secure faster grant."
  pdf: "/files/publications/2026-when-goals-align-fast-track-patent-applications.pdf"
